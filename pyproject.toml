[project]
name = "gram-event-quant"
version = "0.1.0"
description = "Quantitative Research Platform for GRAM/TON Event Studies"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "polars>=1.20.0",
    "pydantic-settings>=2.7.1",
    "pydantic>=2.10.6",
    "pyarrow>=18.1.0",
    "telethon>=1.38.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gram_quant"]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.25.3",
    "pytest>=8.3.4",
    "ruff>=0.9.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: mark test as requiring external APIs or live dependencies",
]
